  <text x="64" y="181" font-family="Segoe UI,Arial,sans-serif" font-size="76" font-weight="750" letter-spacing="-3" fill="#ffffff">SSH-one</text>
  <rect x="67" y="207" width="262" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="68" y="252" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#dbeaff">SSH · VPN · WebSocket · Xray</text>
  <text x="68" y="292" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#a9c1dd">Cloudflare DNS setup  •  UDP Custom 1–65535</text>
